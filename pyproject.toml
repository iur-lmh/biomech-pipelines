[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "biomech-pipelines"
version = "0.1.0"
description = "Parsing, normalización, anonimización y exportación de datos biomecánicos del LMH (IUR-UCASAL)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Laboratorio de Movimiento Humano — IUR/UCASAL" }]
keywords = ["biomechanics", "rehabilitation", "research", "c3d", "anonymization"]
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-dateutil>=2.9,<3.0",
  "typer>=0.12,<0.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
]
parquet = ["pyarrow>=16.0"]

[project.scripts]
biomech = "biomech_pipelines.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/biomech_pipelines"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["biomech_pipelines"]
branch = true
